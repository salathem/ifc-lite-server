# Baut das IFC-Lite-Server-Image aus dem vendorierten MPL-2.0-Quellcode
# (upstream/) und pusht es nach GHCR. Hintergrund: ghcr.io/ltplus-ag/ifc-lite-server
# ist kein oeffentliches Package (Pull liefert 401), darum bauen wir selbst.
name: Build & Push Server Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Minimalrechte: Quellcode lesen, Packages schreiben. Sonst nichts.
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-dockerfile:
    name: Dockerfile-Lint (nicht blockierend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Informativ: das Dockerfile stammt unveraendert vom Upstream, Findings
      # werden hier nur sichtbar gemacht, nicht als Fehler gewertet.
      - name: hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: upstream/apps/server/Dockerfile
          failure-threshold: error

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # Ein kalter Build kompiliert den ganzen Rust-Workspace (cargo-chef cook).
    # Das dauert auf einem GitHub-Runner deutlich laenger als auf dem
    # 4-Kern-Depot-Runner des Upstreams; warme Builds sind Minuten.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI verlangt kleingeschriebene Repository-Namen; github.repository_owner
      # behaelt die Schreibweise des GitHub-Accounts bei.
      - name: Image-Namen kleinschreiben
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF=ghcr.io/${owner}/ifc-lite-server" >> "$GITHUB_ENV"

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REF }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=ifc-lite-server
            org.opencontainers.image.description=IFC-Lite Server (MPL-2.0, Upstream LTplus-AG/ifc-lite), Backend fuer den Trassia-Viewer
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Build-Kontext ist der vendorierte Workspace-Root: das Dockerfile
          # macht `COPY . .` und erwartet Cargo.toml/Cargo.lock/rust/ ganz oben.
          context: upstream
          file: upstream/apps/server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # Rust-Build-Cache: `actions/cache` auf ~/.cargo bringt hier nichts,
          # weil cargo im Container laeuft und dessen $CARGO_HOME nie auf dem
          # Runner liegt. Der wirksame Cache ist der Buildx-Layer-Cache: er
          # konserviert die cargo-chef-Stage "cook" (alle Abhaengigkeiten
          # vorkompiliert), und genau die ist der teure Teil.
          # mode=max cacht auch die Zwischenstages, nicht nur das Endimage.
          cache-from: type=gha,scope=ifc-lite-server
          cache-to: type=gha,mode=max,scope=ifc-lite-server
          # cargo-chef/cargo im Container: 2 parallele Jobs passen zum
          # RAM-Budget eines Standard-Runners (entspricht dem Dockerfile-Default;
          # bei OOM im Builder hier auf 1 senken).
          build-args: |
            CARGO_BUILD_JOBS=2

      - name: Ergebnis
        run: |
          echo "Gepusht:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
